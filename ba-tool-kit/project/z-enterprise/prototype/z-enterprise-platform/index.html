<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z Enterprise — Admin Console</title>
  <link rel="stylesheet" href="styles.css?v=8.3">
</head>
<body>

  <div class="app-shell">

    <!-- Left Sidebar (Clean Minimalism) -->
    <aside class="sidebar">
      <!-- App Brand -->
      <div class="sidebar-brand">
        <div class="brand-logo-box">Z</div>
        <div class="brand-text-group">
          <div class="brand-title">Z Enterprise</div>
          <div class="brand-subtitle">Admin Console</div>
        </div>
      </div>

      <!-- Main Navigation -->
      <nav class="sidebar-nav">
        <button class="nav-link active" data-view="overview" id="nav-overview">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
          <span class="nav-label">Tổng quan</span>
        </button>

        <button class="nav-link" data-view="quota" id="nav-quota">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="nav-label">Quota</span>
          <span class="nav-badge" id="sidebar-attention-badge" style="display:none;">0</span>
        </button>

        <button class="nav-link" data-view="quota_allocation" id="nav-quota-allocation">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
            <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
          </svg>
          <span class="nav-label">Phân bổ quota</span>
        </button>
      </nav>

      <!-- Secondary Navigation -->
      <div class="sidebar-secondary">
        <button class="nav-link" data-view="audit_log" id="nav-audit-log">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="nav-label">Nhật ký audit</span>
        </button>
      </div>

      <!-- User Profile & Persona Switcher at Bottom -->
      <div class="sidebar-user-footer">
        <div class="user-profile-widget" id="user-profile-widget" title="Bấm để chuyển nhanh vai trò Super Admin / Branch Admin">
          <div class="user-avatar-circle" id="user-avatar-circle">AU</div>
          <div class="user-details">
            <div class="user-display-name" id="user-display-name">Admin User</div>
            <div class="user-role-badge" id="user-role-badge">Super Admin</div>
          </div>
          <!-- Quick Persona Switcher Toggle -->
          <button class="btn-persona-switch" id="btn-persona-switch" title="Chuyển đổi vai trò Super Admin / Branch Admin">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <circle cx="12" cy="5" r="2"></circle>
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="12" cy="19" r="2"></circle>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">

      <!-- Top Header Bar -->
      <header class="top-header">
        <div class="header-search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="global-search-input" id="global-search-input" 
                 placeholder="Tìm kiếm nhân viên, email hoặc mã tài khoản Zalo...">
        </div>

        <div class="header-action-group">
          <!-- Role Indicator Pill -->
          <div class="role-scope-tag" id="top-scope-tag">
            Toàn doanh nghiệp (Super Admin)
          </div>

          <button class="btn btn-outline" id="btn-export-quota">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Xuất dữ liệu Quota</span>
          </button>

          <button class="btn btn-primary" id="btn-top-assign-account">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>Cấp tài khoản Zalo</span>
          </button>

          <button class="btn-icon" title="Thông báo" id="btn-notifications">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-dot" id="header-notif-dot"></span>
          </button>

          <button class="btn-icon" title="Trợ giúp & Nguyên lý quản trị Quota" id="btn-help-modal">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Scrollable Body -->
      <main class="page-container" id="page-container">
        <!-- Rendered dynamically by app.js based on active view -->
      </main>

    </div>

  </div>

  <!-- Side Drawer Backdrop -->
  <div class="side-drawer-backdrop drawer-backdrop" id="side-drawer-backdrop" style="display: none;"></div>

  <!-- Side Drawer Panel (Chi tiết nhân sự & Quota trượt cạnh phải) -->
  <aside class="side-drawer" id="side-drawer" aria-label="Chi tiết nhân sự & Tài khoản Zalo">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h3 class="drawer-title" id="drawer-title">Hồ sơ Nhân viên</h3>
        <p class="drawer-subtitle" id="drawer-subtitle">Mã NV • Email</p>
      </div>
      <button class="drawer-close" id="drawer-close-btn" title="Đóng">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <!-- Dynamic Profile, Zalo Account, Timeline -->
    </div>
    <div class="drawer-footer" id="drawer-footer">
      <!-- Dynamic Buttons (Cấp, Bàn giao, Tạm khóa, Mở khóa, Thu hồi, Nhắc nhở) -->
    </div>
  </aside>

  <!-- Floating Bulk Action Bar (Thanh thao tác hàng loạt khi chọn nhiều nhân sự) -->
  <div class="floating-bulk-bar" id="floating-bulk-bar" style="display: none;">
    <div class="bulk-bar-content">
      <div class="bulk-counter-wrap">
        <span class="bulk-check-icon">✓</span>
        <span class="bulk-counter-text" id="bulk-selected-count">Đã chọn 0 nhân viên</span>
      </div>
      <div class="bulk-action-buttons">
        <button class="btn btn-sm btn-outline btn-warn" id="bulk-btn-suspend">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <span>Tạm khóa</span>
        </button>
        <button class="btn btn-sm btn-outline btn-danger" id="bulk-btn-revoke">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Thu hồi tài khoản</span>
        </button>
        <button class="btn btn-sm btn-outline" id="bulk-btn-export">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Xuất danh sách</span>
        </button>
        <button class="btn-bulk-dismiss" id="bulk-btn-deselect" title="Bỏ chọn tất cả">
          &times;
        </button>
      </div>
    </div>
  </div>

  <!-- Reusable Action Modal -->
  <div class="modal-backdrop" id="app-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Tiêu đề tác vụ</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic Form -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <!-- Dynamic Buttons -->
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-hub" id="toast-hub"></div>

  <!-- Application Logic -->
  <script src="app.js?v=8.3"></script>
</body>
</html>
