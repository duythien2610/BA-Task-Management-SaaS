<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="310" viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg" font-family="Calibri,Arial,sans-serif">
  <rect x="0" y="0" width="640" height="310" fill="#fff" stroke="#000" stroke-width="1"/>

  <!-- FT-007 Refactor (sprint 1, top-centre) -->
  <rect x="240" y="20" width="160" height="50" rx="3" fill="#000"/>
  <text x="320" y="42" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">FT-007: Refactor</text>
  <text x="320" y="58" font-size="9" fill="#aaa" text-anchor="middle">Sprint 1 (Wks 1–2) — Hard prerequisite</text>

  <!-- Arrows down from FT-007 to 3 features -->
  <!-- to FT-002 -->
  <line x1="320" y1="70" x2="130" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#dep)"/>
  <text x="195" y="103" font-size="8" fill="#333">enables</text>
  <!-- to FT-003 -->
  <line x1="320" y1="70" x2="320" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#dep)"/>
  <text x="330" y="103" font-size="8" fill="#333">enables</text>
  <!-- to FT-006 -->
  <line x1="320" y1="70" x2="510" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#dep)"/>
  <text x="415" y="103" font-size="8" fill="#333">enables</text>

  <!-- FT-002 Time Tracking (left) -->
  <rect x="30" y="120" width="200" height="50" rx="3" fill="#222"/>
  <text x="130" y="142" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">FT-002: Time Tracking</text>
  <text x="130" y="158" font-size="9" fill="#aaa" text-anchor="middle">Sprint 2–3 (Wks 3–5)</text>

  <!-- FT-003 Notification (centre) -->
  <rect x="240" y="120" width="160" height="50" rx="3" fill="#444"/>
  <text x="320" y="142" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">FT-003: Notification</text>
  <text x="320" y="158" font-size="9" fill="#aaa" text-anchor="middle">Sprint 5–6 (Wks 9–11)</text>

  <!-- FT-006 Bulk Action (right) -->
  <rect x="415" y="120" width="190" height="50" rx="3" fill="#555"/>
  <text x="510" y="142" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">FT-006: Bulk Action</text>
  <text x="510" y="158" font-size="9" fill="#aaa" text-anchor="middle">Sprint 5 (Wk 9)</text>

  <!-- FT-001 Export — partial dep on FT-002 -->
  <rect x="240" y="220" width="160" height="50" rx="3" fill="#333"/>
  <text x="320" y="242" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">FT-001: Export Excel</text>
  <text x="320" y="258" font-size="9" fill="#aaa" text-anchor="middle">Sprint 3–4 (Wks 5–8)</text>

  <!-- FT-002 → FT-001 (View 3 hours data) -->
  <line x1="130" y1="170" x2="260" y2="220" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#depgray)"/>
  <text x="160" y="207" font-size="8" fill="#777">View 3 (hours data)</text>
  <text x="160" y="218" font-size="8" fill="#777">partial dep</text>

  <!-- FT-007 → FT-001 indirect arrow (optional direct path) -->
  <line x1="280" y1="70" x2="280" y2="220" stroke="#777" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#depgray)"/>
  <text x="225" y="155" font-size="8" fill="#999" transform="rotate(-90 225,155)">indirect</text>

  <!-- Q3 out-of-scope: FT-005 Public API -->
  <rect x="420" y="220" width="180" height="50" rx="3" fill="#eee" stroke="#aaa" stroke-dasharray="5,3"/>
  <text x="510" y="242" font-size="11" fill="#555" text-anchor="middle">FT-005: Public API</text>
  <text x="510" y="258" font-size="9" fill="#999" text-anchor="middle">[Q3 — Out of Scope]</text>
  <line x1="155" y1="170" x2="490" y2="220" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#deplt)"/>
  <text x="350" y="210" font-size="8" fill="#aaa">schema depends on FT-002 (Q3)</text>

  <!-- Legend -->
  <line x1="20" y1="289" x2="55" y2="289" stroke="#000" stroke-width="1.5" marker-end="url(#dep)"/>
  <text x="60" y="294" font-size="8" fill="#000">Hard dependency</text>
  <line x1="160" y1="289" x2="195" y2="289" stroke="#777" stroke-dasharray="4,3" stroke-width="1.5" marker-end="url(#depgray)"/>
  <text x="200" y="294" font-size="8" fill="#777">Partial dependency</text>
  <rect x="320" y="283" width="12" height="12" fill="#eee" stroke="#aaa" stroke-dasharray="3,2"/>
  <text x="337" y="294" font-size="8" fill="#888">Out of scope (Q3)</text>

  <defs>
    <marker id="dep" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#000"/></marker>
    <marker id="depgray" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#777"/></marker>
    <marker id="deplt" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#bbb"/></marker>
  </defs>
</svg>
