<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="220" viewBox="0 0 580 220" xmlns="http://www.w3.org/2000/svg" font-family="Calibri,Arial,sans-serif">
  <rect x="0" y="0" width="580" height="220" fill="#fff" stroke="#000" stroke-width="1"/>
  <!-- Owner -->
  <rect x="220" y="14" width="140" height="36" rx="3" fill="#000"/>
  <text x="290" y="37" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Owner / Director</text>
  <!-- Admin -->
  <rect x="220" y="80" width="140" height="36" rx="3" fill="#333"/>
  <text x="290" y="103" font-size="11" fill="#fff" text-anchor="middle">Admin</text>
  <!-- Connect Owner→Admin -->
  <line x1="290" y1="50" x2="290" y2="80" stroke="#000" stroke-width="1.5" marker-end="url(#a2)"/>
  <!-- PM -->
  <rect x="220" y="146" width="140" height="36" rx="3" fill="#555"/>
  <text x="290" y="169" font-size="11" fill="#fff" text-anchor="middle">Project Manager</text>
  <!-- Connect Admin→PM -->
  <line x1="290" y1="116" x2="290" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#a2)"/>
  <!-- Member -->
  <rect x="60" y="146" width="130" height="36" rx="3" fill="#777"/>
  <text x="125" y="169" font-size="11" fill="#fff" text-anchor="middle">Member</text>
  <line x1="240" y1="164" x2="190" y2="164" stroke="#777" stroke-width="1.5" marker-end="url(#a2)"/>
  <!-- Client -->
  <rect x="390" y="146" width="130" height="36" rx="3" fill="#bbb" stroke="#888"/>
  <text x="455" y="169" font-size="11" fill="#fff" text-anchor="middle">Client (Read-only)</text>
  <line x1="340" y1="164" x2="390" y2="164" stroke="#bbb" stroke-width="1.5" marker-end="url(#a2)"/>
  <!-- Note -->
  <text x="290" y="207" font-size="9" fill="#666" text-anchor="middle">Each lower role inherits permissions from roles above it. Custom roles are out of scope for Q2.</text>
  <defs>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#444"/>
    </marker>
  </defs>
</svg>
