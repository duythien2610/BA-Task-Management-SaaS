  <text x="312" y="81" font-size="9" fill="#fff" text-anchor="middle" font-family="Calibri,Arial">3 wks</text>

  <!-- FT-001 Export Excel: Wk 5-8 -->
  <text x="5" y="117" font-size="9" font-family="Calibri,Arial">FT-001: Export Excel</text>
  <rect x="338" y="102" width="204" height="22" fill="#444" rx="2"/>
