  <text x="5" y="45" font-size="9" font-family="Calibri,Arial">FT-007: Refactor</text>
  <rect x="134" y="30" width="102" height="22" fill="#222" rx="2"/>
  <text x="185" y="45" font-size="9" fill="#fff" text-anchor="middle" font-family="Calibri,Arial">2 wks</text>

