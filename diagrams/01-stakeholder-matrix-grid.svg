<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" style="width:520px;height:380px;font-family:'Segoe UI',Calibri,Arial,sans-serif;background-color:#ffffff">
  <!-- Background quadrants -->
  <rect x="0" y="0" width="260" height="190" fill="#f0f0f0"/>
  <rect x="260" y="0" width="260" height="190" fill="#e0e0e0"/>
  <rect x="0" y="190" width="260" height="190" fill="#fafafa"/>
  <rect x="260" y="190" width="260" height="190" fill="#f5f5f5"/>
  <!-- Axes -->
  <line x1="260" y1="0" x2="260" y2="380" stroke="#000" stroke-width="2"/>
  <line x1="0" y1="190" x2="520" y2="190" stroke="#000" stroke-width="2"/>
  <!-- Axis labels -->
  <text x="260" y="15" text-anchor="middle" font-size="11" font-weight="bold">HIGH POWER</text>
  <text x="260" y="375" text-anchor="middle" font-size="11" font-weight="bold">LOW POWER</text>
  <text x="8" y="195" font-size="11" font-weight="bold">LOW INTEREST</text>
  <text x="400" y="195" font-size="11" font-weight="bold">HIGH INTEREST</text>
  <!-- Quadrant labels -->
  <text x="130" y="38" text-anchor="middle" font-size="10" fill="#555">KEEP SATISFIED</text>
  <text x="390" y="38" text-anchor="middle" font-size="10" fill="#555">MANAGE CLOSELY</text>
  <text x="130" y="220" text-anchor="middle" font-size="10" fill="#555">MONITOR</text>
  <text x="390" y="220" text-anchor="middle" font-size="10" fill="#555">KEEP INFORMED</text>
  <!-- SH-01: High Power, High Interest -->
  <circle cx="400" cy="80" r="22" fill="#000"/>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SH-01</text>
  <!-- SH-02: High Power, High Interest -->
  <circle cx="450" cy="110" r="22" fill="#000"/>
  <text x="450" y="114" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SH-02</text>
  <!-- SH-03: High Power, High Interest -->
  <circle cx="360" cy="130" r="22" fill="#000"/>
  <text x="360" y="134" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SH-03</text>
  <!-- SH-04: Low Power, High Interest -->
  <circle cx="420" cy="290" r="22" fill="#555"/>
  <text x="420" y="294" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SH-04</text>
  <!-- SH-05: Low Power, High Interest -->
  <circle cx="470" cy="330" r="22" fill="#888"/>
  <text x="470" y="334" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SH-05</text>
  <!-- SH-06: Low Power, High Interest -->
  <circle cx="370" cy="330" r="22" fill="#888"/>
  <text x="370" y="334" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SH-06</text>
</svg>
